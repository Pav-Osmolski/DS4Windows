version: 2
updates:
  - package-ecosystem: "nuget"
    # Cover application, tests, installer helpers and standalone tools.
    directories:
      - "/DS4Windows"
      - "/DS4WindowsTests"
      - "/installer/DS4Windows.Bootstrapper"
      - "/installer/DS4Windows.SetupActions"
      - "/utils/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 3
    groups:
      test-tooling:
        patterns:
          - "MSTest.*"
          - "Microsoft.NET.Test.Sdk"
      windows-management:
        patterns:
          - "System.Management"
          - "System.CodeDom"
      wix-tooling:
        patterns:
          - "WixToolset.*"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build"
