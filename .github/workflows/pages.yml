name: Documentation site

on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "zensical.toml", "README.md", "CHANGELOG.md", "contributors.md", "contributing.md", "DS4Windows/DS4WinWPF.csproj", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "website/**", "zensical.toml", "README.md", "CHANGELOG.md", "contributors.md", "contributing.md", "DS4Windows/DS4WinWPF.csproj", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned documentation tools
        run: python -m pip install -r website/requirements.txt
      - name: Stage canonical documentation
        run: python website/prepare.py
      - name: Build the site
        run: zensical build --clean
      - name: Check generated pages and links
        run: python website/check.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages/site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.prerelease == false))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
