name: 'Out-of-scope Issue'

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  action:
    if: ${{ github.event.label.name == 'out-of-scope' }}
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/support-requests@04320880d61b7fcaac4216e60522cb569478a63d # v5.0.2
        with:
          github-token: ${{ github.token }}
          support-label: 'out-of-scope'
          issue-comment: >
            This report has been marked out of scope for this repository and closed. The conversation remains unlocked; please explain if the scope or controller behaviour was misunderstood.
          issue-close-reason: 'not planned'
          close-issue: true
          lock-issue: false
