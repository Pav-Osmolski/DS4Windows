name: .NET Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing numeric release draft to prepare without publishing (for example 5.0.45)
        required: true
        type: string
      mode:
        description: Promote tested main packages, or explicitly rebuild if the candidate is unavailable
        type: choice
        options: [promote, rebuild]
        default: promote
      candidate_run_id:
        description: Successful main CI run ID (required for promote)
        required: false
        type: string

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  identity:
    # This explicitly requested portable candidate carries its own tested
    # source/checksums/build receipt and does not enter the stable installer lane.
    if: >-
      github.event_name != 'release' ||
      github.repository != 'Pav-Osmolski/DS4Windows' ||
      !github.event.release.prerelease ||
      github.event.release.tag_name != '5.0.47-issue66-connection-preview20261023'
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
      unsigned_release: ${{ steps.release.outputs.unsigned_release }}
      verify_existing: ${{ steps.release.outputs.verify_existing }}
    steps:
    - name: Verify release identity and signing policy
      id: release
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
        EVENT_RELEASE_ID: ${{ github.event.release.id }}
        EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        function Resolve-DraftRelease([string]$repository, [string]$tag) {
          # The published-by-tag REST endpoint does not return drafts.
          $pages = @(gh api --paginate --slurp "repos/$repository/releases?per_page=100" | ConvertFrom-Json)
          $tagMatches = @(foreach ($page in $pages) {
            foreach ($candidate in $page) {
              if ($candidate.tag_name -ceq $tag) { $candidate }
            }
          })
          if ($tagMatches.Count -ne 1 -or $tagMatches[0].id -le 0) { throw 'Draft tag must identify exactly one same-repository release.' }
          $releaseId = $tagMatches[0].id
          $resolved = gh api "repos/$repository/releases/$releaseId" | ConvertFrom-Json
          if ($resolved.id -ne $releaseId -or $resolved.tag_name -cne $tag -or -not $resolved.draft) { throw 'Draft release identity changed during lookup.' }
          return $resolved
        }
        $dispatch = $env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch'
        if ($dispatch -and ($env:GITHUB_REF -cne 'refs/heads/main' -or $env:INPUT_MODE -cnotin @('promote','rebuild'))) {
          throw 'Stable release preparation requires main and an explicit promote/rebuild mode.'
        }
        if ($dispatch -and $env:INPUT_MODE -ceq 'promote' -and $env:INPUT_CANDIDATE_RUN_ID -cnotmatch '^[1-9][0-9]*$') {
          throw 'Promotion requires an explicit successful main CI run ID.'
        }
        $tag = if ($dispatch) { $env:INPUT_TAG } else { $env:EVENT_TAG }
        if ($tag -cnotmatch '^[0-9A-Za-z][0-9A-Za-z._-]{0,79}\z') { throw 'Invalid release tag.' }
        $release = if ($dispatch) {
          Resolve-DraftRelease $env:GITHUB_REPOSITORY $tag
        } else {
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
        }
        if ($release.tag_name -cne $tag -or $release.id -le 0) { throw 'Release identity mismatch.' }
        if ($dispatch -and -not $release.draft) { throw 'Dispatch builds require an existing draft release.' }
        if (-not $dispatch -and ($release.draft -or "$($release.id)" -cne $env:EVENT_RELEASE_ID -or
            $release.prerelease.ToString().ToLowerInvariant() -cne $env:EVENT_PRERELEASE)) {
          throw 'Published event no longer matches the same-repository release.'
        }
        $isPrerelease = $release.prerelease.ToString().ToLowerInvariant()
        $unsignedRc = $isPrerelease -ceq 'true' -and
          $tag -cmatch '^VIIPERRC[0-9]+(\.[0-9]+){0,3}\z'
        $numericStable = $env:GITHUB_REPOSITORY -ceq 'Pav-Osmolski/DS4Windows' -and
          $isPrerelease -ceq 'false' -and
          $tag -cmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' -and
          ([version]$tag) -ge ([version]'5.0.14')
        $unsignedRelease = $unsignedRc -or $numericStable
        if ($dispatch -and -not $numericStable) {
          throw 'New draft builds require a numeric non-prerelease tag of 5.0.14 or newer in this fork.'
        }
        if ($dispatch) {
          # Saving a new draft does not create its Git tag. Materialize only
          # a missing tag, from the explicitly selected dispatch branch.
          $refs = @(gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" | ConvertFrom-Json)
          $exact = @($refs | Where-Object { $_.ref -ceq "refs/tags/$tag" })
          if ($exact.Count -eq 0) {
            $target = gh api "repos/$env:GITHUB_REPOSITORY/commits/$($release.target_commitish)" | ConvertFrom-Json
            if ($target.sha -cne $env:GITHUB_SHA) {
              throw 'A new draft tag must target the same commit as the selected workflow branch.'
            }
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
              -f "ref=refs/tags/$tag" -f "sha=$($target.sha)"
          }
          $tagged = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" | ConvertFrom-Json
          if ($tagged.sha -cne $env:GITHUB_SHA) {
            throw 'Draft builds require the tag and selected workflow commit to match.'
          }
        }
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "release_id=$($release.id)" >> $env:GITHUB_OUTPUT
        "unsigned_release=$($unsignedRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "verify_existing=$(((-not $dispatch) -and $unsignedRelease).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        if ($unsignedRc) {
          Write-Warning 'Unsigned named release candidate; not a signed stable release.'
          'Unsigned named release candidate; Authenticode signing intentionally omitted.' >> $env:GITHUB_STEP_SUMMARY
        } elseif ($numericStable) {
          Write-Warning 'Unsigned numeric release; no Authenticode signature is claimed.'
          'Unsigned numeric release; exact source and asset integrity checks remain mandatory.' >> $env:GITHUB_STEP_SUMMARY
        } else {
          Write-Host 'Approved certificate, identity and timestamp gates remain mandatory.'
        }
  release:
    needs: identity
    if: needs.identity.outputs.verify_existing != 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'rebuild')
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      UNSIGNED_RELEASE: ${{ needs.identity.outputs.unsigned_release }}
      RELEASE_ID: ${{ needs.identity.outputs.release_id }}
    # Build and test a draft before publication. This fork permits unsigned
    # numeric Latest releases; other release types retain signing gates.
    steps:
    - uses: actions/checkout@v7
      with:
           ref: ${{ needs.identity.outputs.tag }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Check release documentation text encoding
      run: python utils/test-text-encoding.py --self-test

    - name: Check every language pack
      run: python utils/validate-language-packs.py
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj', '**/*.props', '**/*.targets', '**/packages.lock.json', 'global.json', 'NuGet.config') }}-package
        restore-keys: nuget-${{ runner.os }}-
    - name: Test exact release source
      shell: pwsh
      run: |
        dotnet test .\DS4WindowsTests\DS4WindowsTests.csproj -c Release -p:Platform=x64 --verbosity minimal --logger trx --results-directory TestResults/main --blame-hang-timeout 5m
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test .\utils\Switch2UsbHardwareVerify.Tests\Switch2UsbHardwareVerify.Tests.csproj -c Release --verbosity minimal --logger trx --results-directory TestResults/standalone --blame-hang-timeout 5m
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python .\utils\test-localization-package.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Preserve release test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: DS4Windows_Release_Test_Results
        path: TestResults/
        if-no-files-found: warn
        retention-days: ${{ job.status == 'success' && 7 || 14 }}
    - name: Restore application publish dependencies
      run: dotnet restore .\DS4Windows\DS4WinWPF.csproj -p:Platform=x64 -p:SelfContained=true
    - name: Set envars for versions
      run: | 
        TAG="$RELEASE_TAG"
        VERSION="${TAG#v}"
        if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,79}$ ]]; then
          echo "Release tag does not produce a filename-safe version." >&2
          exit 1
        fi
        PROJECT_ASSEMBLY_VERSION=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('DS4Windows/DS4WinWPF.csproj').find('.//AssemblyVersion').text)")
        PROJECT_VERSION=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('DS4Windows/DS4WinWPF.csproj').find('.//Version').text)")
        if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}(-.*)?$ ]]; then
          BINARY_VERSION=${VERSION%%-*}
          if [[ "$BINARY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BINARY_VERSION="$BINARY_VERSION.0"
          fi
          PACKAGE_VERSION=$VERSION
        else
          BINARY_VERSION=$PROJECT_ASSEMBLY_VERSION
          PACKAGE_VERSION=$PROJECT_VERSION
        fi
        echo "Release: $VERSION; binary: $BINARY_VERSION; package: $PACKAGE_VERSION"
        printf '%s\n' "VERSION=$VERSION" >> "$GITHUB_ENV"
        printf '%s\n' "BINARY_VERSION=$BINARY_VERSION" >> "$GITHUB_ENV"
        printf '%s\n' "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
      shell: bash
    - name: Build X64
      shell: pwsh
      run: |
        dotnet publish .\DS4Windows\DS4WinWPF.csproj -c Release `
          /p:platform=x64 -r win-x64 --self-contained true --no-restore `
          "-p:AssemblyVersion=$env:BINARY_VERSION" `
          "-p:FileVersion=$env:BINARY_VERSION" `
          "-p:Version=$env:PACKAGE_VERSION" `
          "-p:InformationalVersion=$env:VERSION" `
          -o .\bin\x64\Release\output
    - name: Sign and verify release binaries
      if: env.UNSIGNED_RELEASE != 'true'
      shell: pwsh
      env:
        DS4W_SIGN_CERT_BASE64: ${{ secrets.DS4W_SIGN_CERT_BASE64 }}
        DS4W_SIGN_CERT_PASSWORD: ${{ secrets.DS4W_SIGN_CERT_PASSWORD }}
        DS4W_SIGN_EXPECTED_THUMBPRINT: ${{ secrets.DS4W_SIGN_EXPECTED_THUMBPRINT }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:DS4W_SIGN_CERT_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:DS4W_SIGN_CERT_PASSWORD) -or
            $env:DS4W_SIGN_EXPECTED_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
          throw "Public release signing material or approved signer identity is missing."
        }
        $approvedThumbprint = $env:DS4W_SIGN_EXPECTED_THUMBPRINT.ToUpperInvariant()
        $certificatePath = Join-Path $env:RUNNER_TEMP "ds4windows-release.pfx"
        [IO.File]::WriteAllBytes($certificatePath,
          [Convert]::FromBase64String($env:DS4W_SIGN_CERT_BASE64))
        $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
        # VIIPER is an immutable release input whose exact hash is compiled
        # into DS4Windows. Mutating it here would invalidate that identity.
        $firstPartyBinaries = @(".\bin\x64\Release\output\DS4Windows.exe")
        foreach ($path in $firstPartyBinaries) {
          & $signtool sign /fd SHA256 /f $certificatePath `
            /p $env:DS4W_SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com `
            /td SHA256 $path
          if ($LASTEXITCODE -ne 0) {
            throw "First-party release signing failed for $path."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $path
          if ($signature.Status -ne "Valid" -or
              $signature.SignerCertificate.Thumbprint -ne $approvedThumbprint -or
              -not $signature.TimeStamperCertificate) {
            throw "Required release signature is invalid for ${path}: $($signature.StatusMessage)"
          }
        }
        "DS4W_SIGN_CERT_PATH=$certificatePath" >> $env:GITHUB_ENV
    - name: Post-Build script X64
      shell: pwsh
      run: python .\utils\post-build.py .\bin\x64\Release\output . $env:VERSION
    - name: Verify packaged translations from different launch directories
      shell: pwsh
      run: |
        dotnet build .\utils\SatelliteResourceProbe\SatelliteResourceProbe.csproj -c Release
        .\utils\SatelliteResourceProbe\Run-Probe.ps1 -SourceBuild ".\bin\x64\Release\DS4Windows"
    - name: Build standard installer X64
      shell: pwsh
      env:
        DS4W_SIGN_CERT_PASSWORD: ${{ env.UNSIGNED_RELEASE != 'true' && secrets.DS4W_SIGN_CERT_PASSWORD || '' }}
        DS4W_SIGN_EXPECTED_THUMBPRINT: ${{ env.UNSIGNED_RELEASE != 'true' && secrets.DS4W_SIGN_EXPECTED_THUMBPRINT || '' }}
      run: |
        $parameters = @{
          PublishRoot = ".\bin\x64\Release\DS4Windows"
          ProductVersion = $env:BINARY_VERSION
          BundleVersion = $env:BINARY_VERSION
          DisplayVersion = $env:VERSION
          OutputDirectory = ".\bin\x64\Release\installer"
          SkipApplicationPublish = $true
          RequireSigning = $env:UNSIGNED_RELEASE -ne 'true'
        }
        .\installer\build-installer.ps1 @parameters
    - name: Validate offline installer layout plan
      shell: pwsh
      run: |
        $installer = ".\bin\x64\Release\installer\DS4Windows_${{ env.VERSION }}_Setup_x64.exe"
        $layout = ".\bin\x64\Release\installer-layout"
        $process = Start-Process -FilePath $installer `
          -ArgumentList "/layout `"$layout`" /quiet" `
          -WindowStyle Hidden -PassThru -Wait
        if ($process.ExitCode -ne 0) {
          throw "Installer layout planning failed with exit code $($process.ExitCode)."
        }
        if (-not (Test-Path $layout) -or -not (Get-ChildItem $layout -File -Recurse)) {
          throw "Installer layout planning produced no offline payloads."
        }

    - name: Exercise MSI install, repair, and uninstall lifecycle
      shell: pwsh
      run: |
        $msi = (Resolve-Path ".\installer\DS4Windows.Package\bin\x64\Release\DS4Windows_${{ env.BINARY_VERSION }}_x64.msi").Path
        $msiexec = Join-Path $env:SystemRoot "System32\msiexec.exe"
        $logRoot = Join-Path $env:RUNNER_TEMP "ds4windows-msi-lifecycle"
        New-Item -ItemType Directory -Path $logRoot -Force | Out-Null
        function Invoke-Msi([string]$arguments, [string]$phase) {
          $process = Start-Process -FilePath $msiexec `
            -ArgumentList "$arguments /qn /norestart /L*v `"$logRoot\$phase.log`"" `
            -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "MSI $phase failed with $($process.ExitCode). Log: $logRoot\$phase.log"
          }
        }
        try {
          Invoke-Msi "/i `"$msi`"" "install"
          if (-not (Test-Path "$env:ProgramFiles\DS4Windows\DS4Windows.exe")) {
            throw "MSI install completed without its application keypath."
          }
          Invoke-Msi "/fa `"$msi`"" "repair"
        }
        finally {
          Invoke-Msi "/x `"$msi`"" "uninstall"
        }
        if (Test-Path "HKLM:\SOFTWARE\DS4Windows") {
          $installPath = Get-ItemPropertyValue `
            -Path "HKLM:\SOFTWARE\DS4Windows" -Name InstallPath `
            -ErrorAction SilentlyContinue
          if ($installPath) {
            throw "MSI uninstall left its machine registration behind."
          }
        }

    - name: Verify legacy installer upgrade and preserve profiles (RC4.5.5)
      shell: pwsh
      run: |
        $msi = (Resolve-Path ".\installer\DS4Windows.Package\bin\x64\Release\DS4Windows_${{ env.BINARY_VERSION }}_x64.msi").Path
        .\utils\test-msi-upgrade-metadata.ps1 -ExistingMsi $msi -ExpectedVersion "${{ env.BINARY_VERSION }}"
        .\utils\test-previous-msi-upgrade.ps1 -NewMsi $msi -ExpectedVersion "${{ env.BINARY_VERSION }}"

    - name: Verify recent stable installer upgrade and preserve profiles (5.0.43)
      shell: pwsh
      run: |
        $msi = (Resolve-Path ".\installer\DS4Windows.Package\bin\x64\Release\DS4Windows_${{ env.BINARY_VERSION }}_x64.msi").Path
        .\utils\test-previous-msi-upgrade.ps1 -NewMsi $msi -ExpectedVersion "${{ env.BINARY_VERSION }}" -Baseline Numeric

    - name: Preserve installer lifecycle evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: DS4Windows_Installer_Lifecycle_Evidence
        path: |
          ${{ runner.temp }}/ds4windows-msi-lifecycle/
          ${{ runner.temp }}/ds4windows-previous-msi-upgrade-*/VERIFICATION.json
          ${{ runner.temp }}/ds4windows-previous-msi-upgrade-*/*.log
          ${{ runner.temp }}/ds4windows-previous-msi-upgrade-*/previous-extracted/extraction.json
        if-no-files-found: warn
        retention-days: ${{ job.status == 'success' && 7 || 14 }}

    - name: Name release asset
      shell: pwsh
      run: |
        $source = ".\bin\x64\Release\DS4Windows_$($env:VERSION)_x64.zip"
        $asset = if ($env:VERSION -like "VIIPER*") {
          ".\bin\x64\Release\DS4Windows_VIIPER_x64.zip"
        } else {
          $source
        }
        if ($asset -ne $source) {
          Move-Item -LiteralPath $source -Destination $asset -Force
        }
        $installerSource = ".\bin\x64\Release\installer\DS4Windows_$($env:VERSION)_Setup_x64.exe"
        $installerAsset = ".\bin\x64\Release\installer\DS4Windows_$($env:BINARY_VERSION)_Setup_x64.exe"
        if ($installerAsset -ne $installerSource) {
          Move-Item -LiteralPath $installerSource -Destination $installerAsset -Force
        }
        "RELEASE_ASSET=$asset" >> $env:GITHUB_ENV
        "INSTALLER_ASSET=$installerAsset" >> $env:GITHUB_ENV
    - name: Prepare verified release records
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $records = Join-Path $env:RUNNER_TEMP 'ds4windows-release-records'
        New-Item -ItemType Directory -Path $records | Out-Null
        $publish = (Resolve-Path '.\bin\x64\Release\DS4Windows').Path
        $provenance = Get-Content -LiteralPath (Join-Path $publish 'extras\VIIPER-0.1.17-PROVENANCE.txt') -Raw
        $buildNotes = Get-Content -LiteralPath (Join-Path $publish 'extras\VIIPER-0.1.17-BUILD-NOTES.txt') -Raw
        function Read-RecordField([string]$text, [string]$name, [string]$pattern) {
          $match = [regex]::Match($text, '(?m)^' + [regex]::Escape($name) + ': (' + $pattern + ')\r?$')
          if (-not $match.Success) { throw "Missing or invalid provenance field: $name" }
          return $match.Groups[1].Value
        }
        $brokerName = Read-RecordField $provenance 'Binary' '[0-9A-Za-z._-]+\.exe'
        $brokerHash = Read-RecordField $provenance 'Binary SHA-256' '[A-F0-9]{64}'
        $brokerCommit = Read-RecordField $provenance 'Source commit' '[a-f0-9]{40}'
        $brokerVersion = Read-RecordField $provenance 'Version' 'v[0-9A-Za-z._-]+'
        $brokerSourceName = Read-RecordField $buildNotes 'Source archive' '[0-9A-Za-z._-]+\.zip'
        $brokerSourceHash = Read-RecordField $buildNotes 'Source archive SHA-256' '[A-F0-9]{64}'
        $brokerPath = Join-Path $publish "extras\$brokerName"
        if ((Get-FileHash -LiteralPath $brokerPath -Algorithm SHA256).Hash -cne $brokerHash) {
          throw 'Bundled VIIPER does not match its immutable provenance.'
        }
        # The portable alias is an additional path for the SAME pinned binary.
        $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:RELEASE_ASSET).Path)
        try {
          foreach ($name in @('DS4Windows/viiper.exe', "DS4Windows/extras/$brokerName")) {
            $entry = $zip.GetEntry($name)
            if (-not $entry) { throw "Missing portable broker entry: $name" }
            $stream = $entry.Open()
            try { $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream)) }
            finally { $stream.Dispose() }
            if ($hash -cne $brokerHash) { throw "Portable broker identity mismatch: $name" }
          }
        } finally { $zip.Dispose() }
        $sourceCommit = (git rev-parse HEAD).Trim()
        $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
        if ($sourceCommit -cne $tagCommit) { throw 'Release source does not match its tag.' }
        $ds4Source = Join-Path $records "DS4Windows-$($env:VERSION)-SOURCE.zip"
        git archive --format=zip --prefix=DS4Windows/ --output=$ds4Source HEAD
        # Verify the public exact tag and copy the byte-identical corresponding
        # source bundled offline; the backend can remain a draft during testing.
        $brokerTagCommit = gh api "repos/Pav-Osmolski/VIIPER/commits/$brokerVersion" --jq '.sha'
        if ($brokerTagCommit.Trim() -cne $brokerCommit) { throw 'Pinned VIIPER tag differs from binary source.' }
        $brokerSource = Join-Path $records $brokerSourceName
        Copy-Item -LiteralPath (Join-Path $publish "extras\$brokerSourceName") -Destination $brokerSource
        if ((Get-FileHash -LiteralPath $brokerSource -Algorithm SHA256).Hash -cne $brokerSourceHash) {
          throw 'VIIPER source archive differs from the recorded corresponding-source archive.'
        }
        $noticeNames = @('VIIPER-0.1.17-LICENSES.txt', 'VIIPER-0.1.17-PROVENANCE.txt',
          'VIIPER-0.1.17-BUILD-NOTES.txt', 'VIIPER-SYSTRAY-LICENSE.txt', 'VIIPER-SYSTRAY-NOTICE.md', 'VIIPER-WDL-NOTICE.txt', 'LICENSE.txt')
        $infoDirectory = Join-Path $records 'release-info'
        New-Item -ItemType Directory -Path $infoDirectory | Out-Null
        foreach ($name in $noticeNames) { Copy-Item -LiteralPath (Join-Path $publish "extras\$name") -Destination $infoDirectory }
        $signing = if ($env:UNSIGNED_RELEASE -ceq 'true') { 'Unsigned release (no Authenticode signature)' } else { 'Required Authenticode signing verified' }
        @("DS4Windows release: $env:RELEASE_TAG", "DS4Windows source commit: $sourceCommit",
          "VIIPER source commit: $brokerCommit", "VIIPER binary SHA-256: $brokerHash",
          "Signing: $signing", "GitHub Actions run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") |
          Set-Content -LiteralPath (Join-Path $infoDirectory 'SOURCE-REVISIONS.txt') -Encoding utf8
        $infoName = "DS4Windows-$($env:VERSION)-RELEASE-INFO.zip"
        $infoPath = Join-Path $records $infoName
        $infoFiles = @(Get-ChildItem -LiteralPath $infoDirectory -File | Sort-Object Name)
        Compress-Archive -LiteralPath $infoFiles.FullName -DestinationPath $infoPath
        $releaseInfo = @{ name = $infoName; files = @($infoFiles | ForEach-Object {
          @{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
        }) }
        $assets = @((Resolve-Path $env:RELEASE_ASSET).Path, (Resolve-Path $env:INSTALLER_ASSET).Path) +
          @(Get-ChildItem -LiteralPath $records -File | Sort-Object Name | Select-Object -ExpandProperty FullName)
        if ($assets.Count -ne 5) { throw 'Expected two binary packages, two source ZIPs and one information ZIP.' }
        $checksums = @($assets | ForEach-Object { "$( (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash ) *$([IO.Path]::GetFileName($_))" })
        $checksumPath = Join-Path $records 'SHA256SUMS.txt'
        $checksums | Set-Content -LiteralPath $checksumPath -Encoding ascii
        $assets += $checksumPath
        $receipt = @{
          schema = 1; repository = $env:GITHUB_REPOSITORY; tag = $env:RELEASE_TAG
          sourceCommit = $sourceCommit; releaseId = $env:RELEASE_ID; runId = $env:GITHUB_RUN_ID
          unsignedRc = ($env:RELEASE_TAG -cmatch '^VIIPERRC'); unsignedRelease = ($env:UNSIGNED_RELEASE -ceq 'true')
          prerelease = ($env:RELEASE_TAG -cmatch '^VIIPERRC'); binaryVersion = $env:BINARY_VERSION
          brokerSourceName = $brokerSourceName; brokerCommit = $brokerCommit
          releaseInfo = $releaseInfo
          assets = @($assets | ForEach-Object { @{ name = [IO.Path]::GetFileName($_); sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash } })
        }
        $receiptPath = Join-Path $records 'RELEASE-BUILD.json'
        $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $receiptPath -Encoding utf8
        "RELEASE_RECEIPT_SHA256=$((Get-FileHash -LiteralPath $receiptPath -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV
        $assets += $receiptPath
        $assets | ConvertTo-Json -AsArray | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'ds4windows-release-assets.json') -Encoding utf8
    - name: Verify and publish exact release assets
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $assets = @(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'ds4windows-release-assets.json') -Raw | ConvertFrom-Json)
        $names = @($assets | ForEach-Object { [IO.Path]::GetFileName($_) })
        if (@($names | Sort-Object -Unique).Count -ne $names.Count) { throw 'Duplicate release asset names.' }
        if ($env:RELEASE_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Invalid verified release ID.' }
        $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
        if ("$($release.id)" -cne $env:RELEASE_ID -or $release.tag_name -cne $env:RELEASE_TAG -or
            ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch' -and -not $release.draft)) {
          throw 'Release identity/draft state changed before upload.'
        }
        $existing = @($release.assets.name)
        foreach ($name in $names) {
          if ($existing -contains $name) { throw "Refusing to overwrite existing release asset: $name" }
        }
        $checksumPath = $assets | Where-Object { [IO.Path]::GetFileName($_) -ceq 'SHA256SUMS.txt' }
        $expected = @{}
        foreach ($line in Get-Content -LiteralPath $checksumPath) {
          if ($line -cnotmatch '^([A-F0-9]{64}) \*([^/\\]+)$') { throw 'Invalid generated checksum record.' }
          $expected[$Matches[2]] = $Matches[1]
        }
        foreach ($asset in $assets) {
          if ($asset -ceq $checksumPath -or [IO.Path]::GetFileName($asset) -ceq 'RELEASE-BUILD.json') { continue }
          $name = [IO.Path]::GetFileName($asset)
          if ((Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash -cne $expected[$name]) {
            throw "Release asset changed after verification: $name"
          }
        }
        $receiptPath = $assets | Where-Object { [IO.Path]::GetFileName($_) -ceq 'RELEASE-BUILD.json' }
        if ((Get-FileHash -LiteralPath $receiptPath -Algorithm SHA256).Hash -cne $env:RELEASE_RECEIPT_SHA256) {
          throw 'Release receipt changed after verification.'
        }
        $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
        foreach ($record in $receipt.assets) {
          $matching = @($assets | Where-Object { [IO.Path]::GetFileName($_) -ceq $record.name })
          if ($matching.Count -ne 1 -or (Get-FileHash -LiteralPath $matching[0] -Algorithm SHA256).Hash -cne $record.sha256) {
            throw 'Release receipt does not match the final upload set.'
          }
        }
        # Fresh assets only: never clobber manually prepared bytes or provenance.
        gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY
    - name: Remove signing material
      if: always()
      shell: pwsh
      run: |
        $certificatePath = Join-Path $env:RUNNER_TEMP "ds4windows-release.pfx"
        if (Test-Path -LiteralPath $certificatePath -PathType Leaf) {
          Remove-Item -LiteralPath $certificatePath -Force
        }
  promote:
    needs: identity
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'promote' && needs.identity.outputs.unsigned_release == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_ID: ${{ needs.identity.outputs.release_id }}
      UNSIGNED_RELEASE: ${{ needs.identity.outputs.unsigned_release }}
      GH_TOKEN: ${{ github.token }}
      INPUT_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.identity.outputs.tag }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Verify and fetch exact main release candidate
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        python .\utils\release-candidate.py fetch --run-id $env:INPUT_CANDIDATE_RUN_ID `
          --tag $env:RELEASE_TAG --output (Join-Path $env:RUNNER_TEMP 'main-release-candidate')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Prepare verified release records
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $records = Join-Path $env:RUNNER_TEMP 'ds4windows-release-records'
        New-Item -ItemType Directory -Path $records | Out-Null
        $publish = $env:CANDIDATE_PUBLISH_ROOT
        $provenance = Get-Content -LiteralPath (Join-Path $publish 'extras\VIIPER-0.1.17-PROVENANCE.txt') -Raw
        $buildNotes = Get-Content -LiteralPath (Join-Path $publish 'extras\VIIPER-0.1.17-BUILD-NOTES.txt') -Raw
        function Read-RecordField([string]$text, [string]$name, [string]$pattern) {
          $match = [regex]::Match($text, '(?m)^' + [regex]::Escape($name) + ': (' + $pattern + ')\r?$')
          if (-not $match.Success) { throw "Missing or invalid provenance field: $name" }
          return $match.Groups[1].Value
        }
        $brokerName = Read-RecordField $provenance 'Binary' '[0-9A-Za-z._-]+\.exe'
        $brokerHash = Read-RecordField $provenance 'Binary SHA-256' '[A-F0-9]{64}'
        $brokerCommit = Read-RecordField $provenance 'Source commit' '[a-f0-9]{40}'
        $brokerVersion = Read-RecordField $provenance 'Version' 'v[0-9A-Za-z._-]+'
        $brokerSourceName = Read-RecordField $buildNotes 'Source archive' '[0-9A-Za-z._-]+\.zip'
        $brokerSourceHash = Read-RecordField $buildNotes 'Source archive SHA-256' '[A-F0-9]{64}'
        $brokerPath = Join-Path $publish "extras\$brokerName"
        if ((Get-FileHash -LiteralPath $brokerPath -Algorithm SHA256).Hash -cne $brokerHash) {
          throw 'Bundled VIIPER does not match its immutable provenance.'
        }
        # The portable alias is an additional path for the SAME pinned binary.
        $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:RELEASE_ASSET).Path)
        try {
          foreach ($name in @('DS4Windows/viiper.exe', "DS4Windows/extras/$brokerName")) {
            $entry = $zip.GetEntry($name)
            if (-not $entry) { throw "Missing portable broker entry: $name" }
            $stream = $entry.Open()
            try { $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream)) }
            finally { $stream.Dispose() }
            if ($hash -cne $brokerHash) { throw "Portable broker identity mismatch: $name" }
          }
        } finally { $zip.Dispose() }
        $sourceCommit = (git rev-parse HEAD).Trim()
        $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
        if ($sourceCommit -cne $tagCommit) { throw 'Release source does not match its tag.' }
        $ds4Source = Join-Path $records "DS4Windows-$($env:VERSION)-SOURCE.zip"
        git archive --format=zip --prefix=DS4Windows/ --output=$ds4Source HEAD
        # Verify the public exact tag and copy the byte-identical corresponding
        # source bundled offline; the backend can remain a draft during testing.
        $brokerTagCommit = gh api "repos/Pav-Osmolski/VIIPER/commits/$brokerVersion" --jq '.sha'
        if ($brokerTagCommit.Trim() -cne $brokerCommit) { throw 'Pinned VIIPER tag differs from binary source.' }
        $brokerSource = Join-Path $records $brokerSourceName
        Copy-Item -LiteralPath (Join-Path $publish "extras\$brokerSourceName") -Destination $brokerSource
        if ((Get-FileHash -LiteralPath $brokerSource -Algorithm SHA256).Hash -cne $brokerSourceHash) {
          throw 'VIIPER source archive differs from the recorded corresponding-source archive.'
        }
        $noticeNames = @('VIIPER-0.1.17-LICENSES.txt', 'VIIPER-0.1.17-PROVENANCE.txt',
          'VIIPER-0.1.17-BUILD-NOTES.txt', 'VIIPER-SYSTRAY-LICENSE.txt', 'VIIPER-SYSTRAY-NOTICE.md', 'VIIPER-WDL-NOTICE.txt', 'LICENSE.txt')
        $infoDirectory = Join-Path $records 'release-info'
        New-Item -ItemType Directory -Path $infoDirectory | Out-Null
        foreach ($name in $noticeNames) { Copy-Item -LiteralPath (Join-Path $publish "extras\$name") -Destination $infoDirectory }
        $signing = if ($env:UNSIGNED_RELEASE -ceq 'true') { 'Unsigned release (no Authenticode signature)' } else { 'Required Authenticode signing verified' }
        @("DS4Windows release: $env:RELEASE_TAG", "DS4Windows source commit: $sourceCommit",
          "VIIPER source commit: $brokerCommit", "VIIPER binary SHA-256: $brokerHash",
          "Signing: $signing", "GitHub Actions run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") |
          Set-Content -LiteralPath (Join-Path $infoDirectory 'SOURCE-REVISIONS.txt') -Encoding utf8
        $infoName = "DS4Windows-$($env:VERSION)-RELEASE-INFO.zip"
        $infoPath = Join-Path $records $infoName
        $infoFiles = @(Get-ChildItem -LiteralPath $infoDirectory -File | Sort-Object Name)
        Compress-Archive -LiteralPath $infoFiles.FullName -DestinationPath $infoPath
        $releaseInfo = @{ name = $infoName; files = @($infoFiles | ForEach-Object {
          @{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
        }) }
        $assets = @((Resolve-Path $env:RELEASE_ASSET).Path, (Resolve-Path $env:INSTALLER_ASSET).Path) +
          @(Get-ChildItem -LiteralPath $records -File | Sort-Object Name | Select-Object -ExpandProperty FullName)
        if ($assets.Count -ne 5) { throw 'Expected two binary packages, two source ZIPs and one information ZIP.' }
        $checksums = @($assets | ForEach-Object { "$( (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash ) *$([IO.Path]::GetFileName($_))" })
        $checksumPath = Join-Path $records 'SHA256SUMS.txt'
        $checksums | Set-Content -LiteralPath $checksumPath -Encoding ascii
        $assets += $checksumPath
        $receipt = @{
          candidateRunId = $env:CANDIDATE_RUN_ID; candidateRunAttempt = $env:CANDIDATE_RUN_ATTEMPT
          candidateArtifactId = $env:CANDIDATE_ARTIFACT_ID
          schema = 1; repository = $env:GITHUB_REPOSITORY; tag = $env:RELEASE_TAG
          sourceCommit = $sourceCommit; releaseId = $env:RELEASE_ID; runId = $env:GITHUB_RUN_ID
          unsignedRc = ($env:RELEASE_TAG -cmatch '^VIIPERRC'); unsignedRelease = ($env:UNSIGNED_RELEASE -ceq 'true')
          prerelease = ($env:RELEASE_TAG -cmatch '^VIIPERRC'); binaryVersion = $env:BINARY_VERSION
          brokerSourceName = $brokerSourceName; brokerCommit = $brokerCommit
          releaseInfo = $releaseInfo
          assets = @($assets | ForEach-Object { @{ name = [IO.Path]::GetFileName($_); sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash } })
        }
        $receiptPath = Join-Path $records 'RELEASE-BUILD.json'
        $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $receiptPath -Encoding utf8
        "RELEASE_RECEIPT_SHA256=$((Get-FileHash -LiteralPath $receiptPath -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV
        $assets += $receiptPath
        $assets | ConvertTo-Json -AsArray | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'ds4windows-release-assets.json') -Encoding utf8
    - name: Verify and publish exact release assets
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $assets = @(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'ds4windows-release-assets.json') -Raw | ConvertFrom-Json)
        $names = @($assets | ForEach-Object { [IO.Path]::GetFileName($_) })
        if (@($names | Sort-Object -Unique).Count -ne $names.Count) { throw 'Duplicate release asset names.' }
        if ($env:RELEASE_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Invalid verified release ID.' }
        $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
        if ("$($release.id)" -cne $env:RELEASE_ID -or $release.tag_name -cne $env:RELEASE_TAG -or
            ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch' -and -not $release.draft)) {
          throw 'Release identity/draft state changed before upload.'
        }
        $existing = @($release.assets.name)
        foreach ($name in $names) {
          if ($existing -contains $name) { throw "Refusing to overwrite existing release asset: $name" }
        }
        $checksumPath = $assets | Where-Object { [IO.Path]::GetFileName($_) -ceq 'SHA256SUMS.txt' }
        $expected = @{}
        foreach ($line in Get-Content -LiteralPath $checksumPath) {
          if ($line -cnotmatch '^([A-F0-9]{64}) \*([^/\\]+)$') { throw 'Invalid generated checksum record.' }
          $expected[$Matches[2]] = $Matches[1]
        }
        foreach ($asset in $assets) {
          if ($asset -ceq $checksumPath -or [IO.Path]::GetFileName($asset) -ceq 'RELEASE-BUILD.json') { continue }
          $name = [IO.Path]::GetFileName($asset)
          if ((Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash -cne $expected[$name]) {
            throw "Release asset changed after verification: $name"
          }
        }
        $receiptPath = $assets | Where-Object { [IO.Path]::GetFileName($_) -ceq 'RELEASE-BUILD.json' }
        if ((Get-FileHash -LiteralPath $receiptPath -Algorithm SHA256).Hash -cne $env:RELEASE_RECEIPT_SHA256) {
          throw 'Release receipt changed after verification.'
        }
        $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
        foreach ($record in $receipt.assets) {
          $matching = @($assets | Where-Object { [IO.Path]::GetFileName($_) -ceq $record.name })
          if ($matching.Count -ne 1 -or (Get-FileHash -LiteralPath $matching[0] -Algorithm SHA256).Hash -cne $record.sha256) {
            throw 'Release receipt does not match the final upload set.'
          }
        }
        # Fresh assets only: never clobber manually prepared bytes or provenance.
        gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY
  verify_published_release:
    needs: identity
    if: needs.identity.outputs.verify_existing == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
    - name: Verify published release bytes from the successful draft build
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
        RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        RELEASE_ID: ${{ needs.identity.outputs.release_id }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
        $records = Join-Path $env:RUNNER_TEMP 'verify-published-release'
        New-Item -ItemType Directory -Path $records | Out-Null
        $receiptAsset = @($release.assets | Where-Object { $_.name -ceq 'RELEASE-BUILD.json' })
        if ($receiptAsset.Count -ne 1 -or $receiptAsset[0].uploader.login -cne 'github-actions[bot]') {
          throw 'Published RC has no unique workflow-produced build receipt.'
        }
        gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern RELEASE-BUILD.json --dir $records
        $receipt = Get-Content -LiteralPath (Join-Path $records 'RELEASE-BUILD.json') -Raw | ConvertFrom-Json
        $tagCommit = (gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq '.sha').Trim()
        if ($receipt.schema -ne 1 -or $receipt.repository -cne $env:GITHUB_REPOSITORY -or
            $receipt.tag -cne $env:RELEASE_TAG -or "$($receipt.releaseId)" -cne $env:RELEASE_ID -or
            $receipt.sourceCommit -cne $tagCommit -or
            (-not $receipt.unsignedRc -and ($receipt.unsignedRelease -ne $true -or $receipt.prerelease -ne $false)) -or
            $receipt.brokerSourceName -cnotmatch '^[0-9A-Za-z][0-9A-Za-z._-]+-SOURCE\.zip\z' -or
            "$($receipt.runId)" -cnotmatch '^[0-9]+\z') { throw 'RC receipt identity mismatch.' }
        $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($receipt.runId)" | ConvertFrom-Json
        if ($run.event -cne 'workflow_dispatch' -or $run.status -cne 'completed' -or
            $run.conclusion -cne 'success' -or $run.head_sha -cne $tagCommit -or
            $run.path -cne '.github/workflows/release.yml') { throw 'RC draft build was not a successful exact-source release workflow.' }
        $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
        foreach ($asset in $receipt.assets) {
          if ($asset.name -cnotmatch '^[0-9A-Za-z][0-9A-Za-z._-]{0,159}\z' -or
              $asset.sha256 -cnotmatch '^[A-F0-9]{64}\z' -or -not $seen.Add($asset.name)) { throw 'Invalid RC asset receipt.' }
          $published = @($release.assets | Where-Object { $_.name -ceq $asset.name })
          if ($published.Count -ne 1 -or $published[0].uploader.login -cne 'github-actions[bot]') { throw 'Missing workflow-produced RC asset.' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $asset.name --dir $records
          if ((Get-FileHash -LiteralPath (Join-Path $records $asset.name) -Algorithm SHA256).Hash -cne $asset.sha256) {
            throw "Published RC asset hash mismatch: $($asset.name)"
          }
        }
        $portableName = if ($receipt.unsignedRc) { 'DS4Windows_VIIPER_x64.zip' } else { "DS4Windows_$($env:RELEASE_TAG)_x64.zip" }
        if (-not $receipt.unsignedRc -and ($release.prerelease -or $receipt.binaryVersion -cne "$($env:RELEASE_TAG).0")) {
          throw 'Numeric release channel or Windows version mismatch.'
        }
        foreach ($required in @($portableName, "DS4Windows_$($receipt.binaryVersion)_Setup_x64.exe",
          "DS4Windows-$($env:RELEASE_TAG)-SOURCE.zip", $receipt.brokerSourceName, 'SHA256SUMS.txt')) {
          if (-not $seen.Contains($required)) { throw "Incomplete RC receipt: $required" }
        }
        $noticeNames = @('VIIPER-0.1.17-LICENSES.txt', 'VIIPER-0.1.17-PROVENANCE.txt',
          'VIIPER-0.1.17-BUILD-NOTES.txt', 'VIIPER-SYSTRAY-LICENSE.txt', 'VIIPER-SYSTRAY-NOTICE.md',
          'VIIPER-WDL-NOTICE.txt', 'LICENSE.txt', 'SOURCE-REVISIONS.txt')
        if ($null -ne $receipt.releaseInfo) {
          $infoName = "DS4Windows-$($env:RELEASE_TAG)-RELEASE-INFO.zip"
          if ($receipt.releaseInfo.name -cne $infoName -or -not $seen.Contains($infoName) -or $seen.Count -ne 6 -or $release.assets.Count -ne 7) {
            throw 'Consolidated release must contain exactly the six recorded assets plus its build receipt.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $records $infoName))
          try {
            if ($zip.Entries.Count -ne $noticeNames.Count -or $receipt.releaseInfo.files.Count -ne $noticeNames.Count) {
              throw 'Release information archive has an unexpected file count.'
            }
            foreach ($name in $noticeNames) {
              $entries = @($zip.Entries | Where-Object { $_.FullName -ceq $name })
              $metadata = @($receipt.releaseInfo.files | Where-Object { $_.name -ceq $name })
              if ($entries.Count -ne 1 -or $metadata.Count -ne 1) { throw "Missing or duplicate release information: $name" }
              $stream = $entries[0].Open()
              try { $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream)) }
              finally { $stream.Dispose() }
              if ($hash -cne $metadata[0].sha256) { throw "Release information hash mismatch: $name" }
            }
          } finally { $zip.Dispose() }
        } else {
          # Preserve verification of already-published releases with loose notices.
          foreach ($name in $noticeNames) {
            if (-not $seen.Contains($name)) { throw "Incomplete historical receipt: $name" }
          }
        }
        Write-Host 'Published release matches its successful draft build; no assets rebuilt or overwritten.'
        if (-not $receipt.unsignedRc) {
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F prerelease=false -f make_latest=true
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ("$($latest.id)" -cne $env:RELEASE_ID -or $latest.prerelease -or $latest.draft) {
            throw 'Published numeric release was not selected as Latest.'
          }
        }
