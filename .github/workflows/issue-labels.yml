name: Issue label automation
run-name: 'Issue #${{ github.event.issue.number }}: ${{ github.event.label.name }}'

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  handle-label:
    if: ${{ contains(fromJSON('["duplicate", "out-of-scope", "fix-shipped"]'), github.event.label.name) }}
    runs-on: ubuntu-latest
    steps:
      - name: Close duplicate report
        if: ${{ github.event.label.name == 'duplicate' }}
        uses: dessant/support-requests@04320880d61b7fcaac4216e60522cb569478a63d # v5.0.2
        with:
          github-token: ${{ github.token }}
          support-label: 'duplicate'
          issue-comment: >
            This report has been marked as a duplicate. Please link the existing report so readers can follow it and add relevant reproduction details there. This conversation remains unlocked.
          issue-close-reason: 'not planned'
          close-issue: true
          lock-issue: false

      - name: Close out-of-scope report
        if: ${{ github.event.label.name == 'out-of-scope' }}
        uses: dessant/support-requests@04320880d61b7fcaac4216e60522cb569478a63d # v5.0.2
        with:
          github-token: ${{ github.token }}
          support-label: 'out-of-scope'
          issue-comment: >
            This report has been marked out of scope for this repository and closed. The conversation remains unlocked; please explain if the scope or controller behaviour was misunderstood.
          issue-close-reason: 'not planned'
          close-issue: true
          lock-issue: false

      - name: Close report with a shipped fix
        if: ${{ github.event.label.name == 'fix-shipped' }}
        uses: dessant/support-requests@04320880d61b7fcaac4216e60522cb569478a63d # v5.0.2
        with:
          github-token: ${{ github.token }}
          support-label: 'fix-shipped'
          issue-comment: >
            A fix for this report has been published. Download the current version from https://github.com/Pav-Osmolski/DS4Windows/releases. If the issue still reproduces, reopen the report with the app version, controller details and relevant log.
          issue-close-reason: 'completed'
          close-issue: true
          lock-issue: false
