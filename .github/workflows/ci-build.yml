name: CI Build

# Validate branch/PR source once; build stable packages once on main.
# Explicit previews and infrastructure PRs retain packaging checks.

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]   # tag pushes are handled by release.yml
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      package:
        description: Preview package (choose installer on main to rebuild a release candidate)
        type: choice
        options: [portable, installer, none]
        default: portable


permissions:
  contents: read

# Cancel obsolete revisions of the same branch/PR, never unrelated runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_NOLOGO: true

jobs:
  package_plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.select.outputs.build }}
      test: ${{ steps.select.outputs.test }}
      package: ${{ steps.select.outputs.package }}
      candidate: ${{ steps.select.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check documentation text encoding
        run: python utils/test-text-encoding.py --self-test

      - name: Check every language pack
        run: python utils/validate-language-packs.py
      - name: Select package build
        id: select
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_MANUAL_PACKAGE: ${{ inputs.package || 'portable' }}
        run: |
          .\utils\ci-plan.ps1 -EventName $env:CI_EVENT_NAME `
            -Repository $env:CI_REPOSITORY -RefName $env:CI_REF_NAME `
            -DefaultBranch $env:CI_DEFAULT_BRANCH -BaseCommit $env:CI_BASE_SHA `
            -ManualPackage $env:CI_MANUAL_PACKAGE

  test:
    needs: package_plan
    if: needs.package_plan.outputs.test == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check documentation text encoding
        run: python utils/test-text-encoding.py --self-test

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj', '**/*.props', '**/*.targets', '**/packages.lock.json', 'global.json', 'NuGet.config') }}-tests
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore test dependencies
        shell: pwsh
        run: |
          dotnet restore .\DS4WindowsTests\DS4WindowsTests.csproj -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore .\utils\Switch2UsbHardwareVerify.Tests\Switch2UsbHardwareVerify.Tests.csproj

      - name: Run tests (x64)
        env:
          DS4W_SIDEBAR_ICON_ARTIFACTS: ${{ github.workspace }}/TestResults/sidebar-icons
          DS4W_ABOUT_ARTIFACTS: ${{ github.workspace }}/TestResults/about
        # Keep the complete suite, including profile/settings round trips, as
        # the release gate. Hardware-dependent tests retain explicit opt-in gates.
        run: dotnet test .\DS4WindowsTests\DS4WindowsTests.csproj -c Release -p:Platform=x64 --no-restore --verbosity minimal --logger "trx" --results-directory TestResults/main --blame-hang-timeout 5m

      - name: Run standalone hardware-verification unit tests
        run: dotnet test .\utils\Switch2UsbHardwareVerify.Tests\Switch2UsbHardwareVerify.Tests.csproj -c Release --no-restore --verbosity minimal --logger "trx" --results-directory TestResults/standalone --blame-hang-timeout 5m

      - name: Test branch and PR package selection
        shell: pwsh
        run: |
          .\utils\test-ci-plan.ps1
          python .\utils\test-release-candidate.py

      - name: Test numeric release identity and legacy publication policy
        shell: pwsh
        run: .\utils\test-release-identity.ps1

      - name: Test release information archive and historical compatibility
        shell: pwsh
        run: .\utils\test-release-information.ps1

      - name: Test renamed executable setup process guards
        shell: powershell
        run: .\utils\test-renamed-executable-setup.ps1

      - name: Test unattended setup prompts and mutex release
        shell: powershell
        run: .\utils\test-setup-prompt-ownership.ps1

      - name: Test startup task recovery and ownership
        shell: powershell
        run: .\utils\test-startup-task-registration.ps1 -BackendScript .\extras\install-viiper-backend.ps1

      - name: Test durable startup task backups
        shell: powershell
        run: .\utils\test-startup-task-backup.ps1 -BackendScript .\extras\install-viiper-backend.ps1

      - name: Test USB/IP upgrade reboot boundary and import ownership
        shell: powershell
        run: .\utils\test-viiper-reboot-boundary.ps1 -BackendScript .\extras\install-viiper-backend.ps1

      - name: Test current setup failure diagnostics
        shell: powershell
        run: .\utils\test-infrastructure-failure-summary.ps1

      - name: Test read-only legacy joystick diagnostics
        shell: pwsh
        run: .\utils\test-legacy-joystick-exposure.ps1

      - name: Test MSI identity inspection without installation
        shell: pwsh
        run: .\utils\test-msi-upgrade-metadata.ps1

      - name: Test hosted MSI expected-version contract without installation
        shell: pwsh
        run: .\utils\test-previous-msi-upgrade-parameters.ps1

      - name: Preserve test results and hang diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DS4Windows_Test_Results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: windows-2022
    timeout-minutes: 30
    needs: [test, package_plan]
    if: needs.package_plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64 ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test localization package layout
        run: python .\utils\test-localization-package.py

      - name: Check every language pack
        run: python utils/validate-language-packs.py

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj', '**/*.props', '**/*.targets', '**/packages.lock.json', 'global.json', 'NuGet.config') }}-package
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore application publish dependencies
        run: dotnet restore .\DS4Windows\DS4WinWPF.csproj -p:Platform=x64 -p:SelfContained=true

      - name: Compute version
        id: ver
        shell: pwsh
        env:
          MAIN_CANDIDATE: ${{ needs.package_plan.outputs.candidate }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content DS4Windows/DS4WinWPF.csproj -Raw
          $package = $project.SelectSingleNode('//Version').InnerText
          $product = $project.SelectSingleNode('//AssemblyVersion').InnerText
          if ($package -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $product -cne "$package.0") {
            throw 'Project release and Windows versions must agree.'
          }
          $version = if ($env:MAIN_CANDIDATE -ceq 'true') { $package } else { "$(Get-Date -Format yyyy.MM.dd)-ci-$($env:GITHUB_SHA.Substring(0,7))" }
          $bundle = if ($env:MAIN_CANDIDATE -ceq 'true') { $product } else { "$package-ci.$env:GITHUB_RUN_NUMBER" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "PRODUCT_VERSION=$product" >> $env:GITHUB_ENV
          "PACKAGE_VERSION=$package" >> $env:GITHUB_ENV
          "BUNDLE_VERSION=$bundle" >> $env:GITHUB_ENV

      - name: Build ${{ matrix.platform }}
        run: dotnet publish .\DS4Windows\DS4WinWPF.csproj -c Release /p:platform=${{ matrix.platform }} -r win-${{ matrix.platform }} --self-contained true --no-restore -p:Version=${{ env.PACKAGE_VERSION }} -p:InformationalVersion=${{ env.VERSION }} -p:IncludeSourceRevisionInInformationalVersion=false -o .\bin\${{ matrix.platform }}\Release\output

      - name: Package ${{ matrix.platform }}
        run: python .\utils\post-build.py .\bin\${{ matrix.platform }}\Release\output . ${{ env.VERSION }}

      - name: Verify packaged translations from different launch directories
        shell: pwsh
        run: |
          dotnet build .\utils\SatelliteResourceProbe\SatelliteResourceProbe.csproj -c Release
          .\utils\SatelliteResourceProbe\Run-Probe.ps1 -SourceBuild ".\bin\${{ matrix.platform }}\Release\DS4Windows"

      - name: Build standard installer
        if: needs.package_plan.outputs.package == 'installer'
        shell: pwsh
        run: |
          .\installer\build-installer.ps1 `
            -PublishRoot ".\bin\${{ matrix.platform }}\Release\DS4Windows" `
            -ProductVersion "${{ env.PRODUCT_VERSION }}" `
            -BundleVersion "${{ env.BUNDLE_VERSION }}" `
            -DisplayVersion "${{ env.VERSION }}" `
            -OutputDirectory ".\bin\${{ matrix.platform }}\Release\installer" `
            -SkipApplicationPublish

      - name: Validate offline installer layout plan
        if: needs.package_plan.outputs.package == 'installer'
        shell: pwsh
        run: |
          $installer = ".\bin\${{ matrix.platform }}\Release\installer\DS4Windows_${{ env.VERSION }}_Setup_${{ matrix.platform }}.exe"
          $layout = ".\bin\${{ matrix.platform }}\Release\installer-layout"
          $process = Start-Process -FilePath $installer `
            -ArgumentList "/layout `"$layout`" /quiet" `
            -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Installer layout planning failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path $layout) -or -not (Get-ChildItem $layout -File -Recurse)) {
            throw "Installer layout planning produced no offline payloads."
          }

      - name: Exercise MSI install, repair, and uninstall lifecycle
        if: needs.package_plan.outputs.package == 'installer'
        shell: pwsh
        run: |
          $msi = (Resolve-Path ".\installer\DS4Windows.Package\bin\x64\Release\DS4Windows_${{ env.PRODUCT_VERSION }}_x64.msi").Path
          $msiexec = Join-Path $env:SystemRoot "System32\msiexec.exe"
          $logRoot = Join-Path $env:RUNNER_TEMP "ds4windows-msi-lifecycle"
          New-Item -ItemType Directory -Path $logRoot -Force | Out-Null
          function Invoke-Msi([string]$arguments, [string]$phase) {
            $process = Start-Process -FilePath $msiexec `
              -ArgumentList "$arguments /qn /norestart /L*v `"$logRoot\$phase.log`"" `
              -WindowStyle Hidden -PassThru -Wait
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "MSI $phase failed with $($process.ExitCode). Log: $logRoot\$phase.log"
            }
          }
          try {
            Invoke-Msi "/i `"$msi`"" "install"
            if (-not (Test-Path "$env:ProgramFiles\DS4Windows\DS4Windows.exe")) {
              throw "MSI install completed without its application keypath."
            }
            Invoke-Msi "/fa `"$msi`"" "repair"
          }
          finally {
            Invoke-Msi "/x `"$msi`"" "uninstall"
          }
          if (Test-Path "HKLM:\SOFTWARE\DS4Windows") {
            $installPath = Get-ItemPropertyValue `
              -Path "HKLM:\SOFTWARE\DS4Windows" -Name InstallPath `
              -ErrorAction SilentlyContinue
            if ($installPath) {
              throw "MSI uninstall left its machine registration behind."
            }
          }

      - name: Verify legacy installer upgrade and preserve profiles (RC4.5.5)
        if: needs.package_plan.outputs.package == 'installer'
        shell: pwsh
        run: |
          $msi = (Resolve-Path ".\installer\DS4Windows.Package\bin\x64\Release\DS4Windows_${{ env.PRODUCT_VERSION }}_x64.msi").Path
          .\utils\test-msi-upgrade-metadata.ps1 -ExistingMsi $msi -ExpectedVersion "${{ env.PRODUCT_VERSION }}"
          .\utils\test-previous-msi-upgrade.ps1 -NewMsi $msi -ExpectedVersion "${{ env.PRODUCT_VERSION }}"

      - name: Verify recent stable installer upgrade and preserve profiles (5.0.43)
        if: needs.package_plan.outputs.package == 'installer'
        shell: pwsh
        run: |
          $msi = (Resolve-Path ".\installer\DS4Windows.Package\bin\x64\Release\DS4Windows_${{ env.PRODUCT_VERSION }}_x64.msi").Path
          .\utils\test-previous-msi-upgrade.ps1 -NewMsi $msi -ExpectedVersion "${{ env.PRODUCT_VERSION }}" -Baseline Numeric

      - name: Preserve installer lifecycle evidence
        if: always() && needs.package_plan.outputs.package == 'installer'
        uses: actions/upload-artifact@v7
        with:
          name: DS4Windows_Installer_Lifecycle_Evidence
          path: |
            ${{ runner.temp }}/ds4windows-msi-lifecycle/
            ${{ runner.temp }}/ds4windows-previous-msi-upgrade-*/VERIFICATION.json
            ${{ runner.temp }}/ds4windows-previous-msi-upgrade-*/*.log
            ${{ runner.temp }}/ds4windows-previous-msi-upgrade-*/previous-extracted/extraction.json
          if-no-files-found: warn

      - name: Compose immutable main release candidate
        if: needs.package_plan.outputs.candidate == 'true'
        shell: pwsh
        run: |
          $publish = (Resolve-Path '.\bin\x64\Release\DS4Windows').Path
          foreach ($name in @('DS4Windows.exe','DS4Windows.dll')) {
            $identity = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $publish $name))
            if ($identity.FileVersion -cne $env:PRODUCT_VERSION -or $identity.ProductVersion -cne $env:VERSION) {
              throw "Candidate binary version mismatch: $name"
            }
          }
          $installer = (Resolve-Path ".\bin\x64\Release\installer\DS4Windows_$($env:VERSION)_Setup_x64.exe").Path
          $canonical = Join-Path (Resolve-Path '.\bin\x64\Release').Path "DS4Windows_$($env:PRODUCT_VERSION)_Setup_x64.exe"
          [IO.File]::Copy($installer, $canonical, $false)
          python .\utils\release-candidate.py create `
            --portable ".\bin\x64\Release\DS4Windows_$($env:VERSION)_x64.zip" `
            --installer $canonical --version $env:VERSION --binary-version $env:PRODUCT_VERSION `
            --output '.\bin\x64\Release\candidate'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload immutable main release candidate
        id: candidate
        if: needs.package_plan.outputs.candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: DS4Windows_Release_Candidate_${{ github.sha }}_${{ github.run_attempt }}
          path: .\bin\x64\Release\candidate\*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload portable ZIP
        if: needs.package_plan.outputs.candidate != 'true'
        id: upload_portable
        uses: actions/upload-artifact@v7
        with:
          name: DS4Windows_${{ env.VERSION }}_${{ matrix.platform }}_Portable
          path: .\bin\${{ matrix.platform }}\Release\DS4Windows_${{ env.VERSION }}_${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload standard installer EXE
        if: needs.package_plan.outputs.package == 'installer' && needs.package_plan.outputs.candidate != 'true'
        id: upload_installer
        uses: actions/upload-artifact@v7
        with:
          name: DS4Windows_${{ env.VERSION }}_Setup_${{ matrix.platform }}
          path: .\bin\${{ matrix.platform }}\Release\installer\DS4Windows_${{ env.VERSION }}_Setup_${{ matrix.platform }}.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish artifact link to run summary
        shell: pwsh
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.artifact-url }}
          PORTABLE_URL: ${{ steps.upload_portable.outputs.artifact-url }}
          INSTALLER_URL: ${{ steps.upload_installer.outputs.artifact-url }}
        run: |
          "### DS4Windows x64 - $env:VERSION" >> $env:GITHUB_STEP_SUMMARY
          if ($env:CANDIDATE_URL) { "- [Verified main release candidate]($env:CANDIDATE_URL)" >> $env:GITHUB_STEP_SUMMARY }
          if ($env:PORTABLE_URL) { "- [Portable preview]($env:PORTABLE_URL)" >> $env:GITHUB_STEP_SUMMARY }
          if ($env:INSTALLER_URL) { "- [Installer preview]($env:INSTALLER_URL)" >> $env:GITHUB_STEP_SUMMARY }

  checks:
    name: checks
    if: always()
    needs: [package_plan, test, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected validation gate
        env:
          PLAN_RESULT: ${{ needs.package_plan.result }}
          NEED_TEST: ${{ needs.package_plan.outputs.test }}
          NEED_BUILD: ${{ needs.package_plan.outputs.build }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$NEED_TEST" = true ]; then test "$TEST_RESULT" = success; fi
          if [ "$NEED_BUILD" = true ]; then test "$BUILD_RESULT" = success; fi
